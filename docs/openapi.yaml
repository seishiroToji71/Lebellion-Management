          type: string
          format: uuid
    get:
      summary: List a template's items (ordered, not paginated)
      description: |
        A template's items form a single bounded checklist, returned whole and ordered by `sortOrder`.
        For a linked item (`criterionId` set) the title/standard text is resolved from the library.
      operationId: listChecklistItems
      tags:
