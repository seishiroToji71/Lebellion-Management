    post:
      summary: Add an item to a template (FOUNDER or BRANCH_MANAGER)
      description: |
        Provide `criterionId` to LINK a library criterion: its `type` and title/standard text are
        inherited (not duplicated on the item) and the scalar config fields, when present, override the
        criterion's defaults. Omit `criterionId` for an AD-HOC item, where `type`, `titleRu` and
        `titleUz` are required.
      operationId: createChecklistItem
