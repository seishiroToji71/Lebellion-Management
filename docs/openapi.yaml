  /api/v1/schedules/{scheduleId}:
    parameters:
      - $ref: "#/components/parameters/XAppVersion"
      - name: scheduleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Edit a schedule (FOUNDER or BRANCH_MANAGER)
      description: |
        `recurrence` is immutable. Applying an edit cancels this schedule's future PENDING instances
        (status CANCELLED, not deleted) and — if still active — regenerates them from the new definition.
      operationId: updateSchedule
      tags:
        - Schedules
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScheduleRequest"
      responses:
        "200":
          description: The updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Schedule not found in the caller's scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /api/v1/schedules/{scheduleId}/deactivate:
    parameters:
      - $ref: "#/components/parameters/XAppVersion"
      - name: scheduleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Deactivate a schedule (FOUNDER or BRANCH_MANAGER)
      description: Stops future generation and cancels this schedule's future PENDING instances (CANCELLED).
      operationId: deactivateSchedule
      tags:
        - Schedules
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The deactivated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Schedule not found in the caller's scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /api/v1/task-instances/{taskInstanceId}/submit:
    parameters:
      - $ref: "#/components/parameters/XAppVersion"
      - name: taskInstanceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Submit a task instance
      description: |
        Marks a PENDING task SUBMITTED. (P2-4: status transition only; photos, duplicate-photo
        protection and helper tags arrive in P2-5.) FOUNDER any unit; BRANCH_MANAGER own branch;
        EMPLOYEE own unit. A CANCELLED task yields `409 TASK_CANCELLED` (the attempt is recorded, not a
        404 — an offline client's late upload gets a clear error); any other non-PENDING status yields
        `409 TASK_NOT_OPEN`.
      operationId: submitTaskInstance
      tags:
        - Schedules
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The task instance, now SUBMITTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskInstance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Task not found in the caller's scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`TASK_CANCELLED` (task was cancelled) or `TASK_NOT_OPEN` (already MISSED/SUBMITTED/DONE/...)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived JWT access token issued by the /auth endpoints.

  parameters:
    XAppVersion:
      name: X-App-Version
      in: header
      required: true
      description: |
        Client app version (semver, e.g. `1.4.0`). Required on all `/api/v1` requests.
        Too-old clients get `426 UPGRADE_REQUIRED`.
      schema:
        type: string
        example: "1.4.0"
    XDeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: |
        Stable device identifier generated by the app at install. Required on session-establishing
        auth endpoints (register, login, join, refresh, logout, change-password). Binds the session
        to a device; a refresh presented with a different device id is treated as token theft.
      schema:
        type: string
        example: "8f3b2c10-1c2d-4e5f-9a0b-1122334455aa"
    Limit:
      name: limit
      in: query
      required: false
      description: Max items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `nextCursor`. Omit for the first page.
      schema:
        type: string

  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, expired, forged or otherwise invalid access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidCredentials:
      description: |
        Authentication failed. Identical for unknown principal and wrong secret to prevent enumeration.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INVALID_CREDENTIALS
            message: Invalid credentials
    InvalidToken:
      description: Refresh token is unknown, expired, revoked or already rotated (family revoked)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INVALID_TOKEN
            message: Invalid token
    Forbidden:
      description: |
        Authenticated but not allowed to perform this action. Either the role/branch scope forbids it
        (code `FORBIDDEN`), or the user still has `mustChangePassword` set and must change their password
        before calling any endpoint other than `POST /api/v1/auth/change-password` (code `MUST_CHANGE_PASSWORD`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            forbidden:
              value:
                code: FORBIDDEN
                message: Access denied
            mustChangePassword:
              value:
                code: MUST_CHANGE_PASSWORD
                message: Password change required
    UpgradeRequired:
      description: Client app version is no longer supported; upgrade required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: UPGRADE_REQUIRED
            message: Please update the app to continue
    RateLimited:
      description: Too many attempts; retry later
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: RATE_LIMITED
            message: Too many requests

  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    Role:
      type: string
      enum:
        - FOUNDER
        - BRANCH_MANAGER
        - EMPLOYEE

    InvitableRole:
      type: string
      description: Roles that can be granted through an invite (FOUNDER is never invitable).
      enum:
        - BRANCH_MANAGER
        - EMPLOYEE

    InviteStatus:
      type: string
      enum:
        - PENDING
        - USED
        - EXPIRED
        - REVOKED

    RegisterRequest:
      type: object
      required:
        - organizationName
        - fullName
        - password
      properties:
        organizationName:
          type: string
          minLength: 1
          maxLength: 255
        fullName:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: [string, "null"]
          format: email
          description: Required if `phone` is absent.
        phone:
          type: [string, "null"]
          description: Normalized to E.164. Required if `email` is absent.
          example: "+998901234567"
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
          writeOnly: true

    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          description: Email or E.164 phone number.
        password:
          type: string
          format: password
          writeOnly: true

    JoinRequest:
      type: object
      required:
        - inviteCode
        - fullName
      properties:
        inviteCode:
          type: string
          writeOnly: true
        fullName:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: [string, "null"]
          format: password
          minLength: 10
          maxLength: 128
          writeOnly: true
          description: |
            Required for a BRANCH_MANAGER invite (the manager's login email/phone is carried by the
            invite). Must be omitted for EMPLOYEE invites and for recovery invites.

    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          writeOnly: true

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
          writeOnly: true
        newPassword:
          type: string
          format: password
          minLength: 10
          maxLength: 128
          writeOnly: true

    AuthResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          description: Short-lived JWT (~15 minutes).
        refreshToken:
          type: string
          description: Opaque high-entropy token. Rotated on every refresh.
        tokenType:
          type: string
          enum:
            - Bearer
          example: Bearer
        expiresIn:
          type: integer
          description: Access token lifetime in seconds.
          example: 900
        user:
          $ref: "#/components/schemas/UserProfile"

    UserProfile:
      type: object
      required:
        - id
        - organizationId
        - fullName
        - role
        - active
        - mustChangePassword
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        fullName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        active:
          type: boolean
        email:
          type: [string, "null"]
          format: email
        phone:
          type: [string, "null"]
        branchId:
          type: [string, "null"]
          format: uuid
          description: Null for FOUNDER; set for BRANCH_MANAGER and EMPLOYEE.
        unitId:
          type: [string, "null"]
          format: uuid
          description: Set for EMPLOYEE; null for FOUNDER and BRANCH_MANAGER.
        mustChangePassword:
          type: boolean
          description: True after an admin/temporary password reset; the client must force a change.

    CreateInviteRequest:
      type: object
      required:
        - role
      properties:
        role:
          allOf:
            - $ref: "#/components/schemas/InvitableRole"
          default: EMPLOYEE
        branchId:
          type: [string, "null"]
          format: uuid
          description: Required when role=BRANCH_MANAGER. Ignored/omitted for EMPLOYEE.
        unitId:
          type: [string, "null"]
          format: uuid
          description: Required when role=EMPLOYEE. Must be omitted for BRANCH_MANAGER.
        email:
          type: [string, "null"]
          format: email
          maxLength: 320
          description: >-
            BRANCH_MANAGER login contact, set by the Founder on the invite. At least one of
            `email`/`phone` is required when role=BRANCH_MANAGER; both must be omitted for EMPLOYEE.
        phone:
          type: [string, "null"]
          maxLength: 20
          description: >-
            BRANCH_MANAGER login contact (E.164), set by the Founder. At least one of
            `email`/`phone` is required when role=BRANCH_MANAGER; both must be omitted for EMPLOYEE.
        expiresInMinutes:
          type: integer
          minimum: 1
          maximum: 43200
          default: 1440
          description: Time-to-live for the code. Defaults to 24 hours.

    ReissueInviteRequest:
      type: object
      properties:
        expiresInMinutes:
          type: integer
          minimum: 1
          maximum: 43200
          default: 1440
          description: TTL for the new code. Defaults to 24 hours.

    InviteResponse:
      type: object
      description: Returned only at create/reissue; carries the one-time plaintext code.
      required:
        - id
        - code
        - role
        - branchId
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Plaintext invite code. Shown ONCE; only its hash is stored.
        role:
          $ref: "#/components/schemas/InvitableRole"
        branchId:
          type: string
          format: uuid
        unitId:
          type: [string, "null"]
          format: uuid
          description: Set for EMPLOYEE invites; null for BRANCH_MANAGER invites.
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    InviteSummary:
      type: object
      description: >-
        Invite metadata for list responses. Never carries the code — not even masked; the plaintext
        is shown once, only in the create/reissue response. Carries no email/phone (personal data).
      required:
        - id
        - role
        - branchId
        - status
        - createdBy
        - createdAt
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/InvitableRole"
        branchId:
          type: string
          format: uuid
          description: For an EMPLOYEE invite this is derived from the unit's branch.
        unitId:
          type: [string, "null"]
          format: uuid
        status:
          allOf:
            - $ref: "#/components/schemas/InviteStatus"
          description: EXPIRED is computed from expiresAt at read time; only PENDING/USED/REVOKED are stored.
        createdBy:
          type: string
          format: uuid
          description: The user (Founder/Manager) who issued the invite.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        usedAt:
          type: [string, "null"]
          format: date-time
          description: When the invite was consumed; null unless status is USED.

    RecoveryInviteRequest:
      type: object
      properties:
        expiresInMinutes:
          type: integer
          minimum: 1
          maximum: 43200
          default: 1440
          description: TTL for the recovery code. Defaults to 24 hours.

    RecoveryInviteResponse:
      type: object
      description: >-
        Returned once on issue. Carries the one-time recovery `code`; for a BRANCH_MANAGER target it
        also carries a one-time `temporaryPassword` (null for an EMPLOYEE, who has no password).
      required:
        - id
        - code
        - targetEmployeeId
        - role
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Plaintext recovery code. Shown ONCE; only its hash is stored.
        targetEmployeeId:
          type: string
          format: uuid
        role:
          allOf:
            - $ref: "#/components/schemas/InvitableRole"
          description: The target user's role (EMPLOYEE or BRANCH_MANAGER); never FOUNDER.
        temporaryPassword:
          type: [string, "null"]
          description: One-time temporary password; set only for a BRANCH_MANAGER target, null otherwise.
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    CreateBranchRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        address:
          type: [string, "null"]

    Branch:
      type: object
      required:
        - id
        - organizationId
        - name
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time

    CreateUnitRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    Unit:
      type: object
      required:
        - id
        - organizationId
        - branchId
        - name
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    BranchPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Branch"
        nextCursor:
          type: [string, "null"]
          description: Cursor for the next page; null when there are no more items.

    UnitPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Unit"
        nextCursor:
          type: [string, "null"]

    EmployeePage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserProfile"
        nextCursor:
          type: [string, "null"]

    InvitePage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InviteSummary"
        nextCursor:
          type: [string, "null"]

    ItemType:
      type: string
      enum: [PHOTO, MANUAL, NUMERIC]
      description: |
        PHOTO — employee uploads a photo, reviewer accepts/rejects.
        MANUAL — reviewer scores directly, no photo.
        NUMERIC — a monthly number scored from a configurable scale (scale arrives with scoring in P2-6).

    CreateCriterionRequest:
      type: object
      required:
        - type
        - titleRu
        - titleUz
      properties:
        type:
          $ref: "#/components/schemas/ItemType"
        titleRu:
          type: string
          minLength: 1
          maxLength: 120
        titleUz:
          type: string
          minLength: 1
          maxLength: 120
        standardRu:
          type: [string, "null"]
          maxLength: 500
        standardUz:
          type: [string, "null"]
          maxLength: 500
        originalText:
          type: [string, "null"]
          maxLength: 4000
        photoRequired:
          type: boolean
          default: false
        points:
          type: integer
          minimum: 0
          default: 0
        critical:
          type: boolean
          default: false
        staticScene:
          type: boolean
          default: false
        dhashThreshold:
          type: integer
          minimum: 0
          maximum: 64
          default: 6

    Criterion:
      type: object
      required:
        - id
        - organizationId
        - type
        - titleRu
        - titleUz
        - photoRequired
        - points
        - critical
        - staticScene
        - dhashThreshold
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ItemType"
        titleRu:
          type: string
        titleUz:
          type: string
        standardRu:
          type: [string, "null"]
        standardUz:
          type: [string, "null"]
        originalText:
          type: [string, "null"]
        photoRequired:
          type: boolean
          description: Default photo_required seeded onto a linked item.
        points:
          type: integer
          description: Default points seeded onto a linked item.
        critical:
          type: boolean
        staticScene:
          type: boolean
        dhashThreshold:
          type: integer
        createdAt:
          type: string
          format: date-time

    CriterionPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Criterion"
        nextCursor:
          type: [string, "null"]

    CreateChecklistTemplateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    ChecklistTemplate:
      type: object
      required:
        - id
        - organizationId
        - unitId
        - name
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        unitId:
          type: string
          format: uuid
        positionId:
          type: [string, "null"]
          format: uuid
          description: Reserved for the future positions model (P2-2); null until positions are defined.
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    ChecklistTemplatePage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistTemplate"
        nextCursor:
          type: [string, "null"]

    CreateChecklistItemRequest:
      type: object
      description: |
        LINK a criterion with `criterionId` (then `type`/text are inherited and the scalar fields override
        the criterion's defaults), or omit it for an AD-HOC item (then `type`, `titleRu`, `titleUz` are
        required). The scalar fields are nullable so "not provided" (inherit/default) differs from a value.
      properties:
        criterionId:
          type: [string, "null"]
          format: uuid
        type:
          oneOf:
            - $ref: "#/components/schemas/ItemType"
            - type: "null"
        titleRu:
          type: [string, "null"]
          maxLength: 120
        titleUz:
          type: [string, "null"]
          maxLength: 120
        standardRu:
          type: [string, "null"]
          maxLength: 500
        standardUz:
          type: [string, "null"]
          maxLength: 500
        originalText:
          type: [string, "null"]
          maxLength: 4000
        photoRequired:
          type: [boolean, "null"]
        points:
          type: [integer, "null"]
          minimum: 0
        critical:
          type: [boolean, "null"]
        staticScene:
          type: [boolean, "null"]
        dhashThreshold:
          type: [integer, "null"]
          minimum: 0
          maximum: 64
        sortOrder:
          type: integer
          default: 0

    ChecklistItem:
      type: object
      required:
        - id
        - organizationId
        - templateId
        - type
        - photoRequired
        - points
        - critical
        - staticScene
        - dhashThreshold
        - sortOrder
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
        criterionId:
          type: [string, "null"]
          format: uuid
          description: When set, the item links a library criterion and the title/standard text below is resolved from it.
        type:
          $ref: "#/components/schemas/ItemType"
        titleRu:
          type: [string, "null"]
        titleUz:
          type: [string, "null"]
        standardRu:
          type: [string, "null"]
        standardUz:
          type: [string, "null"]
        originalText:
          type: [string, "null"]
        photoRequired:
          type: boolean
        points:
          type: integer
        critical:
          type: boolean
        staticScene:
          type: boolean
        dhashThreshold:
          type: integer
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time

    Recurrence:
      type: string
      enum: [DAILY, WEEKLY]

    TaskStatus:
      type: string
      enum: [PENDING, SUBMITTED, REJECTED, EXTENSION_REQUESTED, DONE, MISSED, EXTENDED, CANCELLED]
      description: |
        User-visible are DONE / MISSED / EXTENDED; the rest are internal. CANCELLED = the schedule was
        edited/deactivated; a kept (not deleted) occurrence so a late submission gets a clear error.

    SlotRequest:
      type: object
      required:
        - slotTime
      properties:
        slotTime:
          type: string
          example: "23:00"
          description: Local time-of-day (Asia/Tashkent).
        photoRequired:
          type: [boolean, "null"]
          description: Overrides the item's photo_required for this slot; null => use the item's value.
        sortOrder:
          type: integer
          default: 0

    UpdateScheduleRequest:
      type: object
      description: |
        Edit a schedule. `recurrence` is immutable (kept); everything else is the new desired state.
        Cancels future PENDING and — if still active — regenerates them.
      properties:
        intervalDays:
          type: integer
          minimum: 1
          default: 1
        anchorDate:
          type: [string, "null"]
          format: date
        slotWindowMinutes:
          type: integer
          minimum: 1
          default: 60
        active:
          type: boolean
          default: true
        slots:
          type: array
          items:
            $ref: "#/components/schemas/SlotRequest"

    CreateScheduleRequest:
      type: object
      required:
        - recurrence
      properties:
        recurrence:
          $ref: "#/components/schemas/Recurrence"
        intervalDays:
          type: integer
          minimum: 1
          default: 1
        anchorDate:
          type: [string, "null"]
          format: date
        slotWindowMinutes:
          type: integer
          minimum: 1
          default: 60
        slots:
          type: array
          items:
            $ref: "#/components/schemas/SlotRequest"

    Slot:
      type: object
      required:
        - id
        - slotTime
        - sortOrder
      properties:
        id:
          type: string
          format: uuid
        slotTime:
          type: string
          example: "23:00"
        photoRequired:
          type: [boolean, "null"]
        sortOrder:
          type: integer

    Schedule:
      type: object
      required:
        - id
        - organizationId
        - templateId
        - unitId
        - recurrence
        - intervalDays
        - slotWindowMinutes
        - active
        - slots
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
        unitId:
          type: string
          format: uuid
        recurrence:
          $ref: "#/components/schemas/Recurrence"
        intervalDays:
          type: integer
        anchorDate:
          type: [string, "null"]
          format: date
        slotWindowMinutes:
          type: integer
        active:
          type: boolean
        slots:
          type: array
          items:
            $ref: "#/components/schemas/Slot"
        createdAt:
          type: string
          format: date-time

    TaskInstance:
      type: object
      required:
        - id
        - scheduleId
        - templateId
        - itemId
        - unitId
        - periodKey
        - dueAt
        - photoRequired
        - status
      properties:
        id:
          type: string
          format: uuid
        scheduleId:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        unitId:
          type: string
          format: uuid
        slotTime:
          type: [string, "null"]
          example: "23:00"
        periodKey:
          type: string
          example: "D:2026-10-30:23:00"
          description: Occurrence identity ("D:<date>:<HH:mm>" for a daily slot, "W:<isoYear>-W<week>").
        scheduledAt:
          type: [string, "null"]
          format: date-time
        dueAt:
          type: string
          format: date-time
        photoRequired:
          type: boolean
        status:
          $ref: "#/components/schemas/TaskStatus"

    LeadSource:
      type: string
      enum: [ACTING_LEAD, LEAD, BRANCH_MANAGER, NONE]
      description: Where the effective lead came from; NONE = no lead and no branch manager.

    SetUnitLeadRequest:
      type: object
      description: Full replacement — null clears that role.
      properties:
        leadEmployeeId:
          type: [string, "null"]
          format: uuid
        actingLeadEmployeeId:
          type: [string, "null"]
          format: uuid

    UnitLead:
      type: object
      required:
        - unitId
        - source
      properties:
        unitId:
          type: string
          format: uuid
        leadEmployeeId:
          type: [string, "null"]
          format: uuid
        actingLeadEmployeeId:
          type: [string, "null"]
          format: uuid
        effectiveLeadUserId:
          type: [string, "null"]
          format: uuid
          description: Resolved acting_lead -> lead -> branch manager; null only when source is NONE.
        source:
          $ref: "#/components/schemas/LeadSource"

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          example: INVALID_CREDENTIALS
        message:
          type: string
          description: Human-readable, non-sensitive description.

security:
  - bearerAuth: []
