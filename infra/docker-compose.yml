services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: lebellion
      POSTGRES_USER: ${DB_USERNAME:-lebellion}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lebellion}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-lebellion} -d lebellion"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
