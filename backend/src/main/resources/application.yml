spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lebellion}
    username: ${DB_USERNAME:lebellion}
    password: ${DB_PASSWORD:lebellion}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Hard transport caps; the app also enforces lebellion.submission.max-photo-bytes on the decoded file.
      max-file-size: 12MB
      max-request-size: 15MB

server:
  port: ${PORT:8080}
  # Client IP is resolved by ClientIpResolver from the RAW X-Forwarded-For (rightmost trusted hop,
  # honouring trusted-proxy-count) — NOT by Spring. Spring's `framework` strategy keys off the LEFTMOST
  # (client-spoofable) XFF entry and strips the header, which would defeat per-IP rate limiting.
  # Proto/host forwarding (for absolute/signed URLs) will be added explicitly in the photo phase.
  forward-headers-strategy: none

lebellion:
  auth:
    jwt:
      # DEV default only (>=32 bytes for HS256). Override via env in prod; never commit a real secret.
      secret: ${JWT_SECRET:dev-insecure-jwt-secret-change-me-0123456789abcdef}
      access-ttl: PT15M
    refresh:
      employee-sliding: P60D
      manager-sliding: P30D
      manager-absolute: P90D
      # Grace window: a just-rotated token still works this long for honest offline retries
      # (same device only). Reuse past it revokes the whole family (theft detection).
      grace: PT30S
    invite:
      hmac-secret: ${INVITE_HMAC_SECRET:dev-insecure-invite-hmac-secret-change-me}
      ttl: P7D
    password-reset:
      hmac-secret: ${PASSWORD_RESET_HMAC_SECRET:dev-insecure-reset-hmac-secret-change-me}
      code-ttl: PT15M
      max-attempts: 5
    registration-enabled: ${REGISTRATION_ENABLED:false}
    min-app-version: "1.0.0"
    trusted-proxy-count: 1
    # Rate-limit rules per dimension. login/change-password/password-reset are limited by BOTH the
    # client IP and the account (login string or JWT sub) to block guessing from rotating IPs.
    rate-limit:
      login-ip:                    { limit: 10, window: PT1M }
      login-user:                  { limit: 5,  window: PT15M }
      change-password-ip:          { limit: 10, window: PT1M }
      change-password-user:        { limit: 5,  window: PT15M }
      register-ip:                 { limit: 3,  window: PT1H }
      join-ip:                     { limit: 5,  window: PT1M }
      password-reset-request-ip:   { limit: 3,  window: PT15M }
      password-reset-request-user: { limit: 3,  window: PT15M }
      # Issuing/reissuing an invite mints a secret: capped per caller (userId), not per IP, so a
      # compromised FOUNDER/MANAGER account cannot churn out codes. revoke is uncapped (no secret).
      invite-create:               { limit: 20, window: PT1M }
      invite-reissue:              { limit: 20, window: PT1M }
      # Recovery-invite also mints a secret (and, for a manager, a temporary password) — same cap.
      recovery-invite:             { limit: 20, window: PT1M }
  schedule:
    # How far ahead the generator materialises task instances, and the master on/off switches for the jobs.
    horizon-days: 14
    generation-enabled: true
    missed-sweep-enabled: true
  submission:
    # Late window after a task's deadline during which a MISSED task still accepts a late-flagged submission;
    # duplicate-photo comparison window; and the hard per-photo size cap enforced on the decoded file.
    late-window: PT12H
    dup-window-days: 60
    max-photo-bytes: 10485760
  storage:
    local-dir: ${PHOTO_STORAGE_DIR:${java.io.tmpdir}/lebellion-photos}
  media:
    # DEV default only; override via env in prod. Keys the HMAC of short-lived signed photo URLs.
    signing-secret: ${MEDIA_SIGNING_SECRET:dev-insecure-media-signing-secret-change-me}
    url-ttl: PT5M
  kpi:
    # Local, gitignored seed inputs; unset by default (blank => seeder treats as not configured).
    # Set these to run POST /api/v1/kpi/seed. Tests override via @DynamicPropertySource with a fixture.
    catalog-path: ${KPI_CATALOG_PATH:}
    bands-path: ${KPI_BANDS_PATH:}
