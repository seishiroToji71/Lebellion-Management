spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lebellion}
    username: ${DB_USERNAME:lebellion}
    password: ${DB_PASSWORD:lebellion}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
